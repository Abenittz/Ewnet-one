# Render Blueprint — optional. You can also configure the service in the Dashboard.
# Docs: https://render.com/docs/blueprint-spec
#
# Important: do NOT use `bash run_app.sh` on Render (that script requires conda).

services:
  - type: web
    name: ewnet-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.0"
      - key: HOST
        value: "0.0.0.0"
      - key: RUN_MIGRATIONS
        value: "1"
      - key: STORAGE_PATH
        value: "./storage"
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
